[workspace]
members = [
    "phymes-app",
    "phymes-data",
    "phymes-event",
    "phymes-message",
    "phymes-ml",
    "phymes-network",
    "phymes-processor",
    "phymes-schemas",
    "phymes-subject",
    "phymes-server",
    "phymes-streams",
    "phymes-task",
    "phymes-templates",
    "phymes-diagnostics"
]
resolver = "3"

[workspace.dependencies]
anyhow = { version = "1", default-features = false }
arrow = { version = "58.0.0", default-features = false, features = ["csv", "json", "ipc"] }
bytes = "1.11.1"
candle-core = { version = "0.9.2" }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
clap = { version = "4.2.4", features = ["derive"] }
chrono = { version = "0.4.41", features = ["wasmbind"] }
futures = { version = "0.3.31", default-features = false, features = ["alloc"] }
getrandom = { version = "0.3.1", features = ["wasm_js"] }
getrandom_0_2 = { package = "getrandom", version = "0.2.15", features = ["js"] }
minijinja = { version = "2.16.0", features = ["json"] }
minijinja-contrib = { version = "2.16.0", features = ["pycompat"] }
num-traits = { version = "0.2", default-features = false }
parking_lot = "0.12.3"
rayon = { version = "1.6"}
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
tracing = "0.1.41"
tracing-chrome = "0.7.1"
tracing-subscriber = "0.3.7"

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[patch.crates-io]
flate2 = { git = "https://github.com/dmccloskey/flate2-rs.git", branch = "fix/wasm32" }
diff-match-patch-rs = { git = "https://github.com/dmccloskey/diff-match-patch-rs.git", branch = "fix/wasm32" }
