[package]
name = "phymes-ml"
version = "0.3.0"
edition = "2024"
authors = ["Douglas McCloskey"]
description = "The machine learning (ML) and generative AI token services for PHYMES"
license = "MIT AND Apache-2.0"
repository = "https://github.com/biom8er/phymes"
documentation = "https://docs.rs/phymes-ml"

[features]
default = ["wsl", "candle"]
hf_hub = ["dep:candle-hf-hub"]
api = ["dep:reqwest", "phymes-schemas/api", "phymes-data/api"]
wasip2 = ["phymes-diagnostics/wasip2", "phymes-core/wasip2", "phymes-schemas/wasip2", "phymes-data/wasip2", "tokenizers/unstable_wasm", "tokio/sync", "tokio/macros", "tokio/io-util", "tokio/rt"]
wsl = ["phymes-diagnostics/wsl", "phymes-core/wsl", "phymes-schemas/wsl", "phymes-data/wsl", "tokenizers/onig", "tokio/full"]
gpu = ["phymes-data/gpu"]
candle = [] # force use of candle models when api is available

[dependencies]
phymes-diagnostics = { path = "../phymes-diagnostics", default-features = false, optional = true }
phymes-core = { path = "../phymes-core", default-features = false, optional = true }
phymes-data = { path = "../phymes-data", default-features = false, optional = true }
phymes-schemas = { path = "../phymes-schemas", default-features = false, optional = true }
arrow = { version = "58.0.0", default-features = false, features = ["csv", "json", "ipc"] }
candle-core = { version = "0.9.2" }
candle-nn = { version = "0.9.2" }
candle-transformers = { version = "0.9.2" }
candle-flash-attn = { version = "0.9.2", optional = true }
tokio = { version = "1.49.0", default-features = false, optional = true}
futures = { version = "0.3.31", default-features = false }
reqwest = { version = "0.13.2", features = ["json", "stream"], default-features = false, optional = true }
candle-hf-hub = { version = "0.3.3", features = ["tokio"], optional = true }
clap = { version = "4.2.4", features = ["derive"] }
anyhow = { version = "1", default-features = false }
tracing-chrome = "0.7.1"
tracing-subscriber = "0.3.7"
tokenizers = { version = "0.22.2", default-features = false, optional = true }
serde_json = "1.0.133"
serde = "1.0.215"
tracing = "0.1.41"
new_string_template = "1.5"
minijinja = "2.16.0"
minijinja-contrib = { version = "2.16.0", features = ["pycompat"] }
parking_lot = "0.12.3"
bytes = "1.11.1"
getrandom = { version = "0.3.1", features = ["wasm_js"] }
getrandom_0_2 = { package = "getrandom", version = "0.2.15", features = ["js"] }
chrono = "0.4.41"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "candle_asset"
harness = false
