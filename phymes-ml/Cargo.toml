[package]
name = "phymes-ml"
version = "0.3.0"
edition = "2024"
authors = ["Douglas McCloskey"]
description = "The machine learning (ML) and generative AI token services for PHYMES"
license = "MIT AND Apache-2.0"
repository = "https://github.com/biom8er/phymes"
documentation = "https://docs.rs/phymes-ml"

[features]
default = ["wsl", "candle"]
hf_hub = ["dep:candle-hf-hub"]
api = ["dep:reqwest", "phymes-schemas/api", "phymes-data/api"]
wasip2 = ["phymes-diagnostics/wasip2", "phymes-subject/wasip2", "phymes-schemas/wasip2", "phymes-data/wasip2", "tokenizers/unstable_wasm", "tokio/sync", "tokio/macros", "tokio/io-util", "tokio/rt"]
wsl = ["phymes-diagnostics/wsl", "phymes-subject/wsl", "phymes-schemas/wsl", "phymes-data/wsl", "tokenizers/onig", "tokio/full"]
gpu = ["phymes-data/gpu"]
candle = [] # force use of candle models when api is available

[dependencies]
phymes-diagnostics = { path = "../phymes-diagnostics", default-features = false, optional = true }
phymes-subject = { path = "../phymes-subject", default-features = false, optional = true }
phymes-data = { path = "../phymes-data", default-features = false, optional = true }
phymes-schemas = { path = "../phymes-schemas", default-features = false, optional = true }
arrow = { workspace = true }
candle-core= { workspace = true }
candle-nn = { version = "0.10.2" }
candle-transformers = { version = "0.10.2" }
candle-flash-attn = { version = "0.10.2", optional = true }
tokio = { version = "1.49.0", default-features = false, optional = true}
futures = { workspace = true }
reqwest = { version = "0.13.2", features = ["json", "stream"], default-features = false, optional = true }
candle-hf-hub = { version = "0.3.3", features = ["tokio"], optional = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing-chrome = { workspace = true }
tracing-subscriber = { workspace = true }
tokenizers = { version = "0.22.2", default-features = false, optional = true }
serde_json = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
new_string_template = "1.5"
minijinja = { workspace = true }
minijinja-contrib = { workspace = true }
parking_lot = { workspace = true }
bytes  = { workspace = true }
getrandom = { workspace = true }
getrandom_0_2 = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "candle_asset"
harness = false
