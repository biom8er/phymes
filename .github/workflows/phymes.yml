      - name: Check compilation -p phymes-diagnostics --all-targets --no-default-features --features wsl
        run: cargo check -p phymes-diagnostics --all-targets --no-default-features --features wsl
      - name: Check compilation -p phymes-subject --all-targets --no-default-features --features wsl
        run: cargo check -p phymes-subject --all-targets --no-default-features --features wsl
      - name: Check compilation -p phymes-subject --all-targets --no-default-features --features wsl,api
        run: cargo check -p phymes-subject --all-targets --no-default-features --features wsl,api        
      - name: Check compilation -p phymes-schemas --all-targets --no-default-features --features wsl
        run: cargo check -p phymes-schemas --all-targets --no-default-features --features wsl
      - name: Check compilation -p phymes-schemas --all-targets --no-default-features --features wsl,api
        run: cargo check -p phymes-schemas --all-targets --no-default-features --features wsl,api        
      - name: Check compilation -p phymes-event --all-targets --no-default-features --features wsl
        run: cargo check -p phymes-event --all-targets --no-default-features --features wsl
      - name: Check compilation -p phymes-event --all-targets --no-default-features --features wsl,api
        run: cargo check -p phymes-event --all-targets --no-default-features --features wsl,api        
      - name: Check compilation -p phymes-message --all-targets --no-default-features --features wsl
        run: cargo check -p phymes-message --all-targets --no-default-features --features wsl
      - name: Check compilation -p phymes-message --all-targets --no-default-features --features wsl,api
        run: cargo check -p phymes-message --all-targets --no-default-features --features wsl,api
      - name: Check compilation -p phymes-data --all-targets --no-default-features --features wsl
        run: cargo check -p phymes-data --all-targets --no-default-features --features wsl
      - name: Check compilation -p phymes-ml --all-targets --no-default-features --features wsl
        run: cargo check -p phymes-ml --all-targets --no-default-features --features wsl
      - name: Check compilation -p phymes-ml --all-targets --no-default-features --features wsl,hf_hub,candle
        run: cargo check -p phymes-ml --all-targets --no-default-features --features wsl,hf_hub,candle
      - name: Check compilation -p phymes-ml --all-targets --no-default-features --features wsl,api
