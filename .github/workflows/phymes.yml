name: phymes
description: CI for the phymes crates

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  # always trigger
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/**
      - phymes-app/**
      - phymes-diagnostics/**
      - phymes-subject/**
      - phymes-ml/**
      - phymes-data/**
      - phymes-network/**
      - phymes-server/**
      - phymes-schemas/**
      - phymes-event/**
      - phymes-message/**
      - phymes-streams/**
      - phymes-processor/**
      - phymes-task/**
      - phymes-templates/**

env:
  RUST_BACKTRACE: 1

jobs:

  # test the crate on linux
  linux-test:
    name: Test phymes
    runs-on: self-hosted #ubuntu-latest
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: ./.github/actions/rust-build-env
        with:
          target: x86_64-unknown-linux-gnu
      # DM: issues initialzing downloading from HF Hub
      # - name: Download HF models
      #   uses: ./.github/actions/hf-model-cache
      # - name: Run tests
      #   run: cargo test --release
      # DM: Redundant with GPU and WASM tests
      # - name: Run examples for agents
      #   run: |          
      #     cargo run --package phymes-ml --release --example chat -- --weights-config-file "$HOME/.cache/hf/models--HuggingFaceTB--SmolLM2-135M-Instruct/config.json" --weights-file "$HOME/.cache/hf/models--HuggingFaceTB--SmolLM2-135M-Instruct/smollm2-135m-instruct-q4_k_m.gguf" --tokenizer-file "$HOME/.cache/hf/models--HuggingFaceTB--SmolLM2-135M-Instruct/tokenizer.json" --tokenizer-config-file "$HOME/.cache/hf/models--HuggingFaceTB--SmolLM2-135M-Instruct/tokenizer_config.json" --candle-asset "SmoLM2-135M-chat"
      #     cargo run --package phymes-templates --release --example generate_text_network
      - name: Install dioxus
        run: cargo binstall --no-confirm dioxus-cli
      - name: Build phymes-app
        run: |
          dx build -p phymes-app

  # test the crate on linux with cuda
  linux-cuda-test:
    if: false # DM: issues initialzing NVML
    name: Test cuda phymes
    runs-on: self-hosted #ubuntu-latest
    container:
      # DM: needs to match the version installed on the machine
      # e.g., currently 12.6.2 for cudarc-0.12.1
      image: nvidia/cuda:12.6.2-cudnn-devel-ubuntu22.04
      # DM: need to mount the location of `nvidia-smi` and cuda libraries
      # see https://forums.developer.nvidia.com/t/nvidia-smi-command-not-found-in-docker-container/181131/4
      options: --gpus 0 -v /usr/lib/wsl/lib/:/usr/local/bin
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: ./.github/actions/cuda-build-env
        with:
          target: x86_64-unknown-linux-gnu
      - name: Check build
        # DM: If 'Failed to initialize NVML: GPU access blocked by the operating system' on WSL
        # "Inside the file /etc/nvidia-container-runtime/config.toml change no-cgroups from true to false"
        # `sudo sed -i 's/no-cgroups = true/no-cgroups = false/' /etc/nvidia-container-runtime/config.toml`
        # see https://github.com/microsoft/WSL/issues/9962#issuecomment-206645917
        run: |
          export PATH="$PATH:$HOME/.cargo/bin"
          export PATH=$PATH:/usr/local/cuda/bin:/usr/lib/x86_64-linux-gnu/
          export LD_LIBRARY_PATH=/usr/local/bin:/usr/local/cuda/lib64:/usr/local/cuda/lib64/stubs
          cargo check --features wsl,gpu,candle --all-targets
      - name: Run tests
        run: |
          export PATH="$PATH:$HOME/.cargo/bin"
          export PATH=$PATH:/usr/local/cuda/bin:/usr/lib/x86_64-linux-gnu/
          export LD_LIBRARY_PATH=/usr/local/bin:/usr/local/cuda/lib64:/usr/local/cuda/lib64/stubs
          cargo test --features wsl,gpu,candle
      - name: Run examples
        run: |
          export PATH="$PATH:$HOME/.cargo/bin"
          export PATH=$PATH:/usr/local/cuda/bin:/usr/lib/x86_64-linux-gnu/
          export LD_LIBRARY_PATH=/usr/local/bin:/usr/local/cuda/lib64:/usr/local/cuda/lib64/stubs
          cargo run --package phymes-processor --features wsl,gpu,candle --release --example chat -- --weights-config-file "$HOME/.cache/hf/models--HuggingFaceTB--SmolLM2-135M-Instruct/config.json" --weights-file "$HOME/.cache/hf/models--HuggingFaceTB--SmolLM2-135M-Instruct/smollm2-135m-instruct-q4_k_m.gguf" --tokenizer-file "$HOME/.cache/hf/models--HuggingFaceTB--SmolLM2-135M-Instruct/tokenizer.json" --tokenizer-config-file "$HOME/.cache/hf/models--HuggingFaceTB--SmolLM2-135M-Instruct/tokenizer_config.json" --candle-asset "SmoLM2-135M-chat"
          cargo run --package phymes-templates --features wsl,gpu,candle --release --example generate_text_network

  # test compilation features on linux (except those already built in other jobs)
