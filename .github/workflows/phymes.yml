      - name: Check compilation -p phymes-streams --all-targets --no-default-features --features wsl,hf_hub,candle
        run: cargo check -p phymes-streams --all-targets --no-default-features --features wsl,hf_hub,candle
      - name: Check compilation -p phymes-streams --all-targets --no-default-features --features wsl,api
        run: cargo check -p phymes-streams --all-targets --no-default-features --features wsl,api        
      - name: Check compilation -p phymes-processor --no-default-features --all-targets --features wsl
        run: cargo check -p phymes-processor --all-targets --no-default-features --features wsl
      - name: Check compilation -p phymes-processor --all-targets --no-default-features --features wsl,hf_hub,candle
        run: cargo check -p phymes-processor --all-targets --no-default-features --features wsl,hf_hub,candle
      - name: Check compilation -p phymes-processor --all-targets --no-default-features --features wsl,api
        run: cargo check -p phymes-processor --all-targets --no-default-features --features wsl,api        
      - name: Check compilation -p phymes-task --no-default-features --all-targets --features wsl
        run: cargo check -p phymes-task --all-targets --no-default-features --features wsl
      - name: Check compilation -p phymes-task --all-targets --no-default-features --features wsl,hf_hub,candle
        run: cargo check -p phymes-task --all-targets --no-default-features --features wsl,hf_hub,candle
      - name: Check compilation -p phymes-task --all-targets --no-default-features --features wsl,api
        run: cargo check -p phymes-task --all-targets --no-default-features --features wsl,api
      - name: Check compilation -p phymes-network --no-default-features --all-targets --features wsl
        run: cargo check -p phymes-network --all-targets --no-default-features --features wsl
      - name: Check compilation -p phymes-network --all-targets --no-default-features --features wsl,hf_hub,candle
        run: cargo check -p phymes-network --all-targets --no-default-features --features wsl,hf_hub,candle
      - name: Check compilation -p phymes-network --all-targets --no-default-features --features wsl,api
        run: cargo check -p phymes-network --all-targets --no-default-features --features wsl,api        
      - name: Check compilation -p phymes-templates --no-default-features --all-targets --features wsl
        run: cargo check -p phymes-templates --all-targets --no-default-features --features wsl
      - name: Check compilation -p phymes-templates --all-targets --no-default-features --features wsl,hf_hub,candle
        run: cargo check -p phymes-templates --all-targets --no-default-features --features wsl,hf_hub,candle
      - name: Check compilation -p phymes-templates --all-targets --no-default-features --features wsl,api
