[package]
name = "phymes-app"
version = "0.3.0"
authors = ["Douglas McCloskey"]
# DM: updating to 2024 causes many "error[E0716]: temporary value dropped while borrowed"
#  when using dioxus `use_memo`
edition = "2021"
description = "Front-end UI for PHYMES"
license = "MIT AND Apache-2.0"
repository = "https://github.com/biom8er/phymes"
documentation = "https://docs.rs/phymes-app"

[dependencies]
anyhow = { workspace = true }
dioxus = { version = "0.7.3"}
# DM: the "fullstack" feature MUST be specified here as the default and not activated as a feature
#      or the server will not be built using `dx`
futures = { workspace = true }
reqwest = { version = "0.13.2", features = ["json", "stream"], default-features = false }
serde = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
phymes-diagnostics = { path = "../phymes-diagnostics", default-features = false, optional = true }
phymes-subject = { path = "../phymes-subject", default-features = false, optional = true }
phymes-server = { path = "../phymes-server", default-features = false, optional = true }
phymes-network = { path = "../phymes-network", default-features = false, optional = true }
phymes-data = { path = "../phymes-data", default-features = false, optional = true }
phymes-schemas = { path = "../phymes-schemas", default-features = false, optional = true }
phymes-event = { path = "../phymes-event", default-features = false, optional = true }
phymes-message = { path = "../phymes-message", default-features = false, optional = true }
phymes-streams = { path = "../phymes-streams", default-features = false, optional = true }
clap = {version = "4.5.40", optional = true}
tokio = { version = "1.49.0", default-features = false, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["web"]

# Frontend options for plotting
mermaid_js = []
mermaid_js_cdn = ["mermaid_js"] # use the mjs loaded from CDN server
mermaid_js_embed = ["mermaid_js"] # use the js (~3 MB) from local filesystem

# Serverside options for gpu and token/tensor services
wasip2 = ["phymes-diagnostics/wasip2", "phymes-server/wasip2", "phymes-network/wasip2", "phymes-subject/wasip2", "phymes-data/wasip2", "phymes-schemas/wasip2", "phymes-message/wasip2", "phymes-event/wasip2", "phymes-streams/wasip2"]
wsl = ["phymes-diagnostics/wsl", "phymes-server/wsl", "phymes-network/wsl", "phymes-subject/wsl", "phymes-data/wsl", "phymes-schemas/wsl", "phymes-message/wsl", "phymes-event/wsl", "phymes-streams/wsl"]
gpu = ["phymes-server/gpu", "phymes-network/gpu", "phymes-data/gpu", "phymes-streams/gpu"]
candle = ["phymes-server/candle", "phymes-network/candle", "phymes-data/candle"]
hf_hub = ["phymes-server/hf_hub", "phymes-network/hf_hub", "phymes-streams/hf_hub"]
api = ["phymes-server/api", "phymes-network/api", "phymes-message/api", "phymes-event/api", "phymes-streams/api"]
# DM: this is a work in progress because we need to access
#     resources on the device while in the browser context
serverless = [] # Switch to use the serverless application

# Dioxus platform options
web = ["dioxus/web", "wasip2", "mermaid_js_cdn"]
desktop = ["dioxus/desktop", "dioxus/launch", "wasip2", "mermaid_js_embed"]
mobile = ["dioxus/mobile", "wasip2", "mermaid_js_embed"]
# DM: Dioxus builds the server for native and not for the "target" platform e.g., mobile, desktop, etc.
# see https://dioxuslabs.com/learn/0.6/guide/bundle/
server = ["wsl", "candle", "clap/derive", "tokio/full"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
