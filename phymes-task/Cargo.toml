[package]
name = "phymes-task"
version = "0.3.0"
edition = "2024"
authors = ["Douglas McCloskey"]
description = "The tasks that compose the executable graph for PHYMES"
license = "MIT AND Apache-2.0"
repository = "https://github.com/biom8er/phymes"
documentation = "https://docs.rs/phymes-task"

[features]
default = ["wsl", "candle"]
hf_hub = ["phymes-processor/hf_hub", "phymes-streams/hf_hub"]
api = ["phymes-subject/api", "phymes-streams/api", "phymes-processor/api", "phymes-data/api", "phymes-message/api", "phymes-event/api", "dep:urlencoding", "object_store/aws", "object_store/gcp", "object_store/azure", "object_store/http"]
wasip2 = ["phymes-diagnostics/wasip2", "phymes-subject/wasip2", "phymes-streams/wasip2", "phymes-processor/wasip2", "phymes-data/wasip2", "phymes-schemas/wasip2", "phymes-message/wasip2", "phymes-event/wasip2", "tokio/sync", "tokio/macros", "tokio/io-util", "tokio/rt", "dep:object_store"]
wsl = ["dep:tempfile", "phymes-diagnostics/wsl", "phymes-subject/wsl", "phymes-streams/wsl", "phymes-processor/wsl", "phymes-data/wsl", "phymes-schemas/wsl", "phymes-message/wsl", "phymes-event/wsl", "tokio/full", "tracing-subscriber/env-filter", "dep:object_store"]
gpu = ["phymes-streams/gpu", "phymes-processor/gpu", "phymes-data/gpu"]
candle = ["phymes-streams/candle", "phymes-processor/candle", "phymes-data/candle"]
accelerate = ["phymes-streams/accelerate", "phymes-processor/accelerate"]
mkl = ["phymes-streams/mkl", "phymes-processor/mkl"]
mkl-dynamic = ["phymes-streams/mkl-dynamic", "phymes-processor/mkl-dynamic"]

[dependencies]
phymes-subject = { path = "../phymes-subject", default-features = false, optional = true }
phymes-data = { path = "../phymes-data", default-features = false, optional = true }
phymes-diagnostics = { path = "../phymes-diagnostics", default-features = false, optional = true }
phymes-schemas = { path = "../phymes-schemas", default-features = false, optional = true }
phymes-event = { path = "../phymes-event", default-features = false, optional = true }
phymes-message = { path = "../phymes-message", default-features = false, optional = true }
phymes-streams = { path = "../phymes-streams", default-features = false, optional = true }
phymes-processor = { path = "../phymes-processor", default-features = false, optional = true }
arrow = { workspace = true }
tokio = { version = "1.49.0", default-features = false, optional = true}
futures = { version = "0.3.31", default-features = false }
reqwest = { version = "0.13.2", features = ["json", "stream"], default-features = false, optional = true }
clap = { version = "4.2.4", features = ["derive"] }
anyhow = { workspace = true }
tracing = "0.1.41"
tracing-chrome = "0.7.1"
tracing-subscriber = "0.3.7"
serde_json = "1.0.133"
serde = "1.0.215"
parking_lot = "0.12.3"
bytes = "1.11.1"
getrandom = { version = "0.3.1", features = ["wasm_js"] }
getrandom_0_2 = { package = "getrandom", version = "0.2.15", features = ["js"] }
chrono = "0.4.41"
tempfile = { version = "3.25.0", optional = true }
urlencoding = { version = "2.1.3", optional = true }
object_store = { version = "0.13.1", optional = true }
