[package]
name = "phymes-streams"
version = "0.3.0"
edition = "2024"
authors = ["Douglas McCloskey"]
description = "The streaming executors for PHYMES"
license = "MIT AND Apache-2.0"
repository = "https://github.com/biom8er/phymes"
documentation = "https://docs.rs/phymes-streams"

[features]
default = ["wsl", "candle"]
accelerate = ["dep:accelerate-src", "candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
mkl = ["dep:intel-mkl-src", "intel-mkl-src/mkl-static-lp64-iomp", "candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
mkl-dynamic = ["dep:intel-mkl-src", "intel-mkl-src/mkl-dynamic-lp64-iomp", "candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
cudnn = ["candle-core/cudnn"]
flash-attn = ["cuda", "candle-transformers/flash-attn"]
nccl = ["cuda", "cudarc/nccl"]
hf_hub = ["dep:candle-hf-hub", "phymes-ml/hf_hub"]
api = ["reqwest/default-tls", "phymes-data/api", "phymes-schemas/api", "phymes-message/api", "phymes-ml/api", "dep:urlencoding", "quick-xml/serialize", "object_store/aws", "object_store/gcp", "object_store/azure", "object_store/http"]
wasip2 = ["phymes-diagnostics/wasip2", "phymes-subject/wasip2", "phymes-data/wasip2", "phymes-schemas/wasip2", "phymes-message/wasip2", "phymes-ml/wasip2", "tokio/sync", "tokio/macros", "tokio/io-util", "tokio/rt", "dep:quick-xml", "dep:object_store"]
wsl = ["phymes-diagnostics/wsl", "phymes-subject/wsl", "phymes-data/wsl", "phymes-schemas/wsl", "phymes-message/wsl", "phymes-ml/wsl", "tokio/full", "quick-xml/tokio", "dep:object_store", "dep:tempfile"]
gpu = ["phymes-data/gpu", "phymes-ml/gpu", "cuda", "cudnn", "nccl"]
candle = ["phymes-ml/candle"] # force use of candle models when api is available

[dependencies]
phymes-diagnostics = { path = "../phymes-diagnostics", default-features = false, optional = true }
phymes-subject = { path = "../phymes-subject", default-features = false, optional = true }
phymes-data = { path = "../phymes-data", default-features = false, optional = true }
phymes-message = { path = "../phymes-message", default-features = false, optional = true }
phymes-ml = { path = "../phymes-ml", default-features = false, optional = true }
phymes-schemas = { path = "../phymes-schemas", default-features = false, optional = true }
arrow = { workspace = true }
candle-core= { workspace = true }
candle-nn = { version = "0.10.2" }
candle-transformers = { version = "0.10.2" }
candle-flash-attn = { version = "0.10.2", optional = true }
tokio = { version = "1.49.0", default-features = false, optional = true}
futures = { workspace = true }
reqwest = { version = "0.13.2", features = ["json", "stream"], default-features = false, optional = true }
candle-hf-hub = { version = "0.3.3", features = ["tokio"], optional = true }
clap = { workspace = true }
anyhow = { workspace = true }
accelerate-src = { version = "0.3.2", optional = true }
intel-mkl-src = { version = "0.8.1", optional = true }
cudarc = { version = "0.19.7", features = ["f16"], optional = true }
# DM: need to debug the updated version
# Must specify one of the following features: [cuda-version-from-build-system, cuda-12060, cuda-12050, cuda-12040, cuda-12030, cuda-12020, cuda-12010, cuda-12000, cuda-11080, cuda-11070, cuda-11060, cuda-11050, cuda-11040]
# cudarc = { version = "0.12.1", features = ["f16"], optional = true }
serde_json = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
new_string_template = "1.5"
minijinja = { workspace = true }
minijinja-contrib = { workspace = true }
parking_lot = { workspace = true }
bytes  = { workspace = true }
getrandom = { workspace = true }
getrandom_0_2 = { workspace = true }
chrono = { workspace = true }
quick-xml = { version = "0.39.0", default-features = false, optional = true }
urlencoding = { version = "2.1.3", optional = true }
tempfile = { version = "3.25.0", optional = true }
flate2 = { version = "1.1.9" }
object_store = { version = "0.13.1", optional = true }
num-traits = { workspace = true }