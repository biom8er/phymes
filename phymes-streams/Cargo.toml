[package]
name = "phymes-stream"
version = "0.3.0"
edition = "2024"
authors = ["Douglas McCloskey"]
description = "The processor streams for PHYMES"
license = "MIT AND Apache-2.0"
repository = "https://github.com/biom8er/phymes"
documentation = "https://docs.rs/phymes-stream"

[features]
default = ["wsl", "candle"]
accelerate = ["dep:accelerate-src", "candle-core/accelerate"]
mkl = ["dep:intel-mkl-src", "intel-mkl-src/mkl-static-lp64-iomp", "candle-core/mkl"]
mkl-dynamic = ["dep:intel-mkl-src", "intel-mkl-src/mkl-dynamic-lp64-iomp", "candle-core/mkl"]
cuda = ["candle-core/cuda"]
cudnn = ["candle-core/cudnn"]
nccl = ["cuda", "cudarc/nccl"]
wasip2 = ["phymes-core/wasip2", "phymes-diagnostics/wasip2", "phymes-message/wasip2", "phymes-event/wasip2", "phymes-schemas/wasip2", "phymes-processor/wasip2", "tokio/sync", "tokio/macros", "tokio/io-util", "tokio/rt", "lopdf/wasm_js", "dep:quick-xml", "dep:object_store"]
wsl = ["phymes-core/wsl", "phymes-diagnostics/wsl", "phymes-message/wsl", "phymes-event/wsl", "phymes-schemas/wsl", "phymes-processor/wsl", "tokio/full", "lopdf/async", "lopdf/rayon", "quick-xml/tokio", "dep:object_store", "dep:tempfile"]
gpu = ["cuda", "cudnn", "nccl"]
api = ["phymes-core/api", "phymes-message/api", "phymes-event/api", "phymes-schemas/api", "phymes-processor/api", "reqwest/default-tls", "dep:urlencoding", "quick-xml/serialize", "object_store/aws", "object_store/gcp", "object_store/azure", "object_store/http"]
candle = [] # force use of candle models when api is available

[dependencies]
phymes-diagnostics = { path = "../phymes-diagnostics", default-features = false, optional = true }
phymes-core = { path = "../phymes-core", default-features = false, optional = true }
phymes-event = { path = "../phymes-event", default-features = false, optional = true }
phymes-message = { path = "../phymes-message", default-features = false, optional = true }
phymes-schemas = { path = "../phymes-schemas", default-features = false, optional = true }
phymes-processor = { path = "../phymes-processor", default-features = false, optional = true }
arrow = { version = "58.0.0", default-features = false }
candle-core = { version = "0.9.2" }
tokio = { version = "1.49.0", default-features = false, optional = true}
futures = { version = "0.3.31", default-features = false }
clap = { version = "4.2.4", features = ["derive"] }
anyhow = { version = "1", default-features = false }
tracing = "0.1.41"
tracing-chrome = "0.7.1"
tracing-subscriber = "0.3.7"
serde_json = "1.0.133"
serde = "1.0.215"
parking_lot = "0.12.3"
bytes = "1.11.1"
chrono = "0.4.41"
num-traits = { version = "0.2", default-features = false }
quick-xml = { version = "0.39.0", default-features = false, optional = true }
reqwest = { version = "0.13.2", features = ["json", "stream"], default-features = false, optional = true }
urlencoding = { version = "2.1.3", optional = true }
tempfile = { version = "3.25.0", optional = true }
flate2 = { version = "1.1.9" }
object_store = { version = "0.13.1", optional = true }
