[package]
name = "phymes-agents"
version = "0.1.0"
edition = "2024"
authors = ["Douglas McCloskey"]
description = "The Agentic AI templates for PHYMES"
license = "MIT AND Apache-2.0"
repository = "https://github.com/biom8er/phymes"
documentation = "https://docs.rs/phymes-agents"

[features]
default = ["wsl", "candle"]
hf_hub = ["phymes-ai/hf_hub"]
openai_api = ["phymes-ai/openai_api"]
wasip2 = ["phymes-core/wasip2", "phymes-ai/wasip2", "phymes-etl/wasip2", "tokio/sync", "tokio/macros", "tokio/io-util", "tokio/rt", "phymes-core/wasip2"]
wsl = ["phymes-core/wsl", "phymes-ai/wsl", "phymes-etl/wsl", "tokio/full"]
gpu = ["phymes-ai/gpu", "phymes-etl/gpu"]
candle = [] # force use of candle models when openai_api is available

[dependencies]
phymes-core = { path = "../phymes-core", default-features = false, optional = true }
phymes-ai = { path = "../phymes-ai", default-features = false, optional = true }
phymes-etl = { path = "../phymes-etl", default-features = false, optional = true }
arrow = { version = "54.3.1", default-features = false, features = ["csv", "json", "ipc"] }
tokio = { version = "1.45.1", default-features = false, optional = true}
futures = { version = "0.3.31", default-features = false }
reqwest = { version = "0.12.22", features = ["json", "stream"], default-features = false, optional = true }
clap = { version = "4.2.4", features = ["derive"] }
anyhow = { version = "1", features = ["backtrace"] }
tracing = "0.1.41"
tracing-chrome = "0.7.1"
tracing-subscriber = "0.3.7"
serde_json = "1.0.133"
serde = "1.0.215"
parking_lot = "0.12.3"
bytes = "1.10.1"
getrandom = { version = "0.3.1", features = ["wasm_js"] }
getrandom_0_2 = { package = "getrandom", version = "0.2.15", features = ["js"] }
chrono = "0.4.41"

[dev-dependencies]
criterion = { version = "0.3", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "chat_agent_session"
harness = false

[[bench]]
name = "doc_rag_session"
harness = false