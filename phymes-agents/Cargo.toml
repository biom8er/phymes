[package]
name = "phymes-agents"
version = "0.3.0"
edition = "2024"
authors = ["Douglas McCloskey"]
description = "The Agentic AI templates for PHYMES"
license = "MIT AND Apache-2.0"
repository = "https://github.com/biom8er/phymes"
documentation = "https://docs.rs/phymes-agents"

[features]
default = ["wsl", "candle", "api"]
hf_hub = ["phymes-ml/hf_hub"]
api = ["phymes-core/api", "phymes-ml/api", "phymes-data/api", "dep:urlencoding", "object_store/aws", "object_store/gcp", "object_store/azure", "object_store/http"]
wasip2 = ["phymes-diagnostics/wasip2", "phymes-core/wasip2", "phymes-ml/wasip2", "phymes-data/wasip2", "tokio/sync", "tokio/macros", "tokio/io-util", "tokio/rt", "dep:object_store"]
wsl = ["dep:tempfile", "phymes-diagnostics/wsl", "phymes-core/wsl", "phymes-ml/wsl", "phymes-data/wsl", "tokio/full", "tracing-subscriber/env-filter", "dep:object_store"]
gpu = ["phymes-ml/gpu", "phymes-data/gpu"]
candle = [] # force use of candle models when api is available

[dependencies]
phymes-diagnostics = { path = "../phymes-diagnostics", default-features = false, optional = true }
phymes-core = { path = "../phymes-core", default-features = false, optional = true }
phymes-ml = { path = "../phymes-ml", default-features = false, optional = true }
phymes-data = { path = "../phymes-data", default-features = false, optional = true }
arrow = { version = "58.0.0", default-features = false, features = ["csv", "json", "ipc"] }
tokio = { version = "1.49.0", default-features = false, optional = true}
futures = { version = "0.3.31", default-features = false }
reqwest = { version = "0.13.2", features = ["json", "stream"], default-features = false, optional = true }
clap = { version = "4.2.4", features = ["derive"] }
anyhow = { version = "1", default-features = false }
tracing = "0.1.41"
tracing-chrome = "0.7.1"
tracing-subscriber = "0.3.7"
serde_json = "1.0.133"
serde = "1.0.215"
parking_lot = "0.12.3"
bytes = "1.11.1"
getrandom = { version = "0.3.1", features = ["wasm_js"] }
getrandom_0_2 = { package = "getrandom", version = "0.2.15", features = ["js"] }
chrono = "0.4.41"
tempfile = { version = "3.25.0", optional = true }
urlencoding = { version = "2.1.3", optional = true }
object_store = { version = "0.13.1", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "chat_agent_session"
harness = false

[[bench]]
name = "doc_rag_session"
harness = false
