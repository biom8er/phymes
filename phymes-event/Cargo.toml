[package]
name = "phymes-event"
version = "0.3.0"
edition = "2024"
authors = ["Douglas McCloskey"]
description = "The publish and subscribe events used in PHYMES"
license = "MIT AND Apache-2.0"
repository = "https://github.com/biom8er/phymes"
documentation = "https://docs.rs/phymes-event"

[features]
default = ["wsl"]
wasip2 = ["phymes-diagnostics/wasip2", "phymes-core/wasip2", "phymes-schemas/wasip2"]
wsl = ["phymes-diagnostics/wsl", "phymes-core/wsl", "phymes-schemas/wsl"]
hf_hub = []
api = ["phymes-core/api"]
gpu = []
candle = []

[dependencies]
phymes-core = { path = "../phymes-core", default-features = false, optional = true }
phymes-diagnostics = { path = "../phymes-diagnostics", default-features = false, optional = true }
phymes-schemas = { path = "../phymes-schemas", default-features = false, optional = true }
arrow = { version = "58.0.0", default-features = false, features = ["csv", "json", "ipc", "prettyprint"] }
anyhow = { version = "1", default-features = false }
clap = { version = "4.2.4", features = ["derive"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
