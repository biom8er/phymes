[package]
name = "phymes-processor"
version = "0.3.0"
edition = "2024"
authors = ["Douglas McCloskey"]
description = "The streaming message processor used in PHYMES"
license = "MIT AND Apache-2.0"
repository = "https://github.com/biom8er/phymes"
documentation = "https://docs.rs/phymes-processor"

[features]
default = ["wsl", "candle"]
api = ["phymes-subject/api", "phymes-data/api", "phymes-message/api", "phymes-event/api", "phymes-streams/api", "phymes-ml/api", "dep:urlencoding", "object_store/aws", "object_store/gcp", "object_store/azure", "object_store/http"]
wasip2 = ["phymes-diagnostics/wasip2", "phymes-subject/wasip2", "phymes-data/wasip2", "phymes-message/wasip2", "phymes-event/wasip2", "phymes-streams/wasip2", "phymes-ml/wasip2", "phymes-schemas/wasip2", "tokio/sync", "tokio/macros", "tokio/io-util", "tokio/rt", "dep:object_store"]
wsl = ["phymes-diagnostics/wsl", "phymes-subject/wsl", "phymes-data/wsl", "phymes-message/wsl", "phymes-event/wsl", "phymes-streams/wsl", "phymes-schemas/wsl", "phymes-ml/wsl", "tokio/full", "dep:tempfile", "dep:object_store"]
hf_hub = ["phymes-streams/hf_hub", "phymes-ml/hf_hub"]
gpu = ["phymes-data/gpu", "phymes-streams/gpu", "phymes-ml/gpu"]
candle = ["phymes-streams/candle", "phymes-ml/candle"] # force use of candle models when api is available
accelerate = ["phymes-streams/accelerate"]
mkl = ["phymes-streams/mkl"]
mkl-dynamic = ["phymes-streams/mkl-dynamic"]

[dependencies]
phymes-subject = { path = "../phymes-subject", default-features = false, optional = true }
phymes-data = { path = "../phymes-data", default-features = false, optional = true }
phymes-ml = { path = "../phymes-ml", default-features = false, optional = true }
phymes-schemas = { path = "../phymes-schemas", default-features = false, optional = true }
phymes-streams = { path = "../phymes-streams", default-features = false, optional = true }
phymes-diagnostics = { path = "../phymes-diagnostics", default-features = false, optional = true }
phymes-event = { path = "../phymes-event", default-features = false, optional = true }
phymes-message = { path = "../phymes-message", default-features = false, optional = true }
arrow = { workspace = true }
tokio = { version = "1.49.0", default-features = false, optional = true}
futures = { version = "0.3.31", default-features = false }
clap = { version = "4.2.4", features = ["derive"] }
anyhow = { workspace = true }
parking_lot = "0.12.3"
tracing = "0.1.41"
tracing-chrome = "0.7.1"
tracing-subscriber = "0.3.7"
serde_json = "1.0.133"
serde = "1.0.215"
tempfile = { version = "3.25.0", optional = true }
urlencoding = { version = "2.1.3", optional = true }
object_store = { version = "0.13.1", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "candle_ops"
harness = false

[[bench]]
name = "chat"
harness = false