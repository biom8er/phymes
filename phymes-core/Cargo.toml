[package]
name = "phymes-core"
version = "0.3.0"
edition = "2024"
authors = ["Douglas McCloskey"]
description = "The core subject-based message passing algorithm of PHYMES"
license = "MIT AND Apache-2.0"
repository = "https://github.com/biom8er/phymes"
documentation = "https://docs.rs/phymes-core"

[features]
default = ["wsl"]
wasip2 = ["tokio/sync",
    "tokio/macros",
    "tokio/io-util",
    "tokio/rt",
    "dep:object_store",
    "phymes-diagnostics/wasip2"]
wsl = ["dep:tempfile",
    "tokio/full",
    "dep:object_store",
    "phymes-diagnostics/wsl"]
hf_hub = [] # for compatibility with agents
api = ["object_store/aws", "object_store/gcp", "object_store/azure", "object_store/http"]
gpu = [] # for compatibility with agents
candle = [] # for compatibility with agents

[dependencies]
phymes-diagnostics = { path = "../phymes-diagnostics", default-features = false, optional = true }
arrow = { version = "58.0.0", default-features = false, features = ["csv", "json", "ipc", "prettyprint"] }
pin-project-lite = "0.2.16"
async-trait = "0.1.88"
anyhow = { version = "1", default-features = false }
clap = { version = "4.2.4", features = ["derive"] }
futures = { version = "0.3.31", default-features = false, features = ["alloc"] }
tokio = { version = "1.49.0", default-features = false, features = [], optional = true}
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-chrome = "0.7.2"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
tempfile = { version = "3.25.0", optional = true }
parking_lot = "0.12.3"
web-time = "1.1.0"
hashbrown = "0.15.4"
chrono = { version = "0.4.41", features = ["wasmbind"] }
minijinja = { version = "2.19.0", features = ["json"] }
minijinja-contrib = { version = "2.16.0", features = ["pycompat"] }
bytes = "1.11.1"
getrandom = { version = "0.3.1", features = ["wasm_js"] }
num-traits = { version = "0.2", default-features = false }
diff-match-patch-rs = "0.5.1"
object_store = { version = "0.13.1", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "apply_diff"
harness = false
